# APM TLS defaults (installed as apache\conf\extra\apm-ssl.conf). Cert/key are issued by the
# local APM CA (tools\mkcert.php, run by scripts\90-deploy.ps1).
Listen {{BIND}}:{{HTTPS_PORT}}

SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
SSLSessionCache "shmcb:${APM}/tmp/ssl_scache(512000)"
SSLSessionCacheTimeout 300
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
SSLHonorCipherOrder off
SSLSessionTickets off

<VirtualHost _default_:{{HTTPS_PORT}}>
    DocumentRoot "${APM}/www/default"
    ServerName localhost
    SSLEngine on
    SSLCertificateFile    "${APM}/ssl/localhost.crt"
    SSLCertificateKeyFile "${APM}/ssl/localhost.key"
    Protocols h2 http/1.1
</VirtualHost>
