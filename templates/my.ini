# APM my.ini - MariaDB 11.8 (dev box). Placeholders are filled in by scripts\90-deploy.ps1.
# mariadb-install-db copies this into <datadir>\my.ini, which is the file the server runs with.

[client-server]
port = {{DB_PORT}}

[client]
default-character-set = utf8mb4

[mariadbd]
basedir = "{{APM_ROOT}}/mariadb"
datadir = "{{APM_ROOT}}/data/mysql"
bind-address = 127.0.0.1
port = {{DB_PORT}}
# Keep new tables importable into a MariaDB 10.6 production server: 11.x would default to utf8mb4_uca1400_ai_ci,
# which 10.6 does not know -> dumps from APM would fail there.
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
character_set_collations = utf8mb4=utf8mb4_unicode_ci

sql_mode = STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
lower_case_table_names = 2
max_allowed_packet = 256M
max_connections = 200
innodb_buffer_pool_size = 1G
innodb_log_file_size = 256M
innodb_file_per_table = 1
log-error = "{{APM_ROOT}}/logs/mariadb/mariadb.err"
slow_query_log = 1
slow_query_log_file = "{{APM_ROOT}}/logs/mariadb/slow.log"
long_query_time = 2
