; APM php.ini - PHP 8.4 NTS (FastCGI via mod_fcgid)
; Values follow the PHP 8.4 production server this mirrors. Lines marked [dev] deviate on purpose
; for a local dev box. Placeholders are filled in by scripts\90-deploy.ps1.

[PHP]
engine = On
short_open_tag = On
precision = 14
output_buffering = 0
zend.enable_gc = On
expose_php = Off
max_execution_time = 0
max_input_time = -1
max_input_vars = 1000
memory_limit = 128M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On                ; [dev] production: Off
display_startup_errors = On        ; [dev]
log_errors = On
error_log = "{{APM_ROOT}}\logs\php\php_error.log"
default_charset = "UTF-8"
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
upload_tmp_dir = "{{APM_ROOT}}\tmp\uploads"
sys_temp_dir = "{{APM_ROOT}}\tmp"
allow_url_fopen = On
allow_url_include = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 120
cgi.fix_pathinfo = 1
fastcgi.impersonate = 0

extension_dir = "{{APM_ROOT}}\php\ext"
; igbinary must load before redis
extension = igbinary
extension = redis
; bcmath calendar curl ctype dom iconv session xml* zlib ... are built into php8.dll
extension = exif
extension = ffi
extension = fileinfo
extension = ftp
extension = gd
extension = gettext
extension = imagick
extension = intl
extension = mbstring
extension = mysqli
extension = openssl
extension = pdo_mysql
extension = pdo_sqlite
extension = shmop
extension = soap
extension = sockets
extension = sodium
extension = sqlite3
extension = xsl
extension = zip
zend_extension = opcache

[Date]
date.timezone = Asia/Bangkok

[Pcre]
pcre.jit = 1

[mysqlnd]
mysqlnd.collect_statistics = Off

[MySQLi]
mysqli.default_host = 127.0.0.1
mysqli.default_port = {{DB_PORT}}

[Pdo_mysql]
pdo_mysql.default_socket =

[Session]
session.save_handler = files
session.save_path = "{{APM_ROOT}}\tmp\sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 0
session.cookie_secure = 0
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0        ; [dev] production: 60 - edits must show up immediately
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
; Windows: processes with the same cache_id share one OPcache segment. Two APM folders running at once
; (or any other PHP of the same build) would collide -> "Opcode handlers are unusable due to ASLR" and
; every request 500s. A per-folder id keeps them apart; the file cache is the fallback if mapping fails.
opcache.cache_id = "{{CACHE_ID}}"
opcache.file_cache = "{{APM_ROOT}}\tmp\opcache"
opcache.file_cache_fallback = 1

[curl]
curl.cainfo = "{{APM_ROOT}}\ssl\cacert.pem"

[openssl]
openssl.cafile = "{{APM_ROOT}}\ssl\cacert.pem"
