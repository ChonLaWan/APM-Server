# APM httpd.conf - Apache 2.4 (mpm_winnt) + PHP 8.4 NTS via mod_fcgid
# Placeholders are filled in by scripts\90-deploy.ps1. Module set follows the Linux production server it mirrors.

Define APM "{{APM_ROOT}}"
ServerRoot "${APM}/apache"
# Default is <ServerRoot>/logs/httpd.pid, but deploy keeps logs in ${APM}/logs -> without this line
# httpd exits right after start with AH00099 (could not create pid file)
PidFile "${APM}/logs/apache/httpd.pid"
Listen {{BIND}}:{{HTTP_PORT}}
ServerName localhost:{{HTTP_PORT}}
ServerAdmin admin@localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule actions_module modules/mod_actions.so
LoadModule alias_module modules/mod_alias.so
LoadModule allowmethods_module modules/mod_allowmethods.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule brotli_module modules/mod_brotli.so
LoadModule cache_module modules/mod_cache.so
LoadModule cache_disk_module modules/mod_cache_disk.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule fcgid_module modules/mod_fcgid.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule http2_module modules/mod_http2.so
LoadModule include_module modules/mod_include.so
LoadModule info_module modules/mod_info.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule remoteip_module modules/mod_remoteip.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule status_module modules/mod_status.so
LoadModule unique_id_module modules/mod_unique_id.so
LoadModule version_module modules/mod_version.so

DocumentRoot "${APM}/www/default"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${APM}/www">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.php index.html index.htm
<Files ".ht*">
    Require all denied
</Files>
<FilesMatch "^\.(env|git)">
    Require all denied
</FilesMatch>

ErrorLog "${APM}/logs/apache/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined
CustomLog "${APM}/logs/apache/access.log" combined

TypesConfig conf/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz

Protocols h2 h2c http/1.1
Timeout 300
KeepAlive On
MaxKeepAliveRequests 500
KeepAliveTimeout 5
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
EnableSendfile Off
EnableMMAP Off
AcceptFilter http none
AcceptFilter https none

<IfModule mpm_winnt_module>
    ThreadsPerChild 250
    MaxConnectionsPerChild 0
</IfModule>

# --- PHP 8.4 NTS through mod_fcgid (closest Windows match to a Linux php-fpm production server) ---
FcgidInitialEnv PHPRC "${APM}/php"
FcgidInitialEnv PHP_FCGI_MAX_REQUESTS 10000
FcgidInitialEnv SystemRoot "C:/Windows"
FcgidInitialEnv TEMP "${APM}/tmp"
FcgidInitialEnv TMP "${APM}/tmp"
FcgidIOTimeout 300
FcgidBusyTimeout 300
FcgidConnectTimeout 20
FcgidMaxRequestsPerProcess 10000
FcgidMaxProcesses 32
FcgidMaxRequestLen 67108864
FcgidOutputBufferSize 0
FcgidPassHeader Authorization
<FilesMatch "\.php$">
    SetHandler fcgid-script
</FilesMatch>
# inner \" quotes: mod_fcgid splits the wrapper command line on spaces (apr_tokenize_to_argv), so a path
# like "D:/APM test/php/php-cgi.exe" must be quoted inside the directive argument as well
FcgidWrapper "\"${APM}/php/php-cgi.exe\"" .php
<Directory "${APM}/www">
    <FilesMatch "\.php$">
        Options +ExecCGI
    </FilesMatch>
</Directory>

# --- compression (same as production: deflate + brotli) ---
<IfModule brotli_module>
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/xml application/javascript application/json image/svg+xml
</IfModule>
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json image/svg+xml
</IfModule>

<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

Include conf/extra/apm-ssl.conf
IncludeOptional conf/vhosts/*.conf
