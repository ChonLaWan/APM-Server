# Build the whole APM stack from source on a Windows runner and (optionally) publish the portable zip.
# Manual only (Actions tab -> release -> Run workflow): a cold build takes roughly 3-4 hours on a hosted
# runner, and Windows minutes count double on private repos, so it never runs by itself.
#   release_tag empty  -> build + smoke test + workflow artifact
#   release_tag v1.2.3 -> also create/update that GitHub Release with APM-<ver>-win64.zip (+ .sha256)
name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish to this release tag (e.g. v1.0.1); leave empty for a test build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ hashFiles('deps/apache/vcpkg.json', 'ports-overlay/**') }}

      - name: Prepare
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Build (fetch -> package)
        shell: pwsh
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
        run: ./scripts/build-all.ps1

      - name: Smoke test the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\APM-*-win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\apm test"
          $root = Get-ChildItem "$env:RUNNER_TEMP\apm test" -Directory | Select-Object -First 1
          $m = Join-Path $root.FullName 'manager\APMManager.exe'
          cmd /c "`"$m`" --setup --http 8081 --https 8444 --db 3308 > setup.txt 2>&1"; Get-Content setup.txt
          if ($LASTEXITCODE) { throw 'setup failed' }
          cmd /c "`"$m`" --cli start > start.txt 2>&1"; Get-Content start.txt
          if ($LASTEXITCODE) { throw 'start failed' }
          $page = curl.exe -s http://localhost:8081/
          if ($page -notmatch 'MariaDB</td><td><code>\d') { throw 'site did not answer with PHP + MariaDB' }
          cmd /c "`"$m`" --cli stop > stop.txt 2>&1"; Get-Content stop.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apm-win64
          path: |
            dist/APM-*-win64.zip
            dist/APM-*-win64.zip.sha256

      - name: Publish release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/APM-*-win64.zip
            dist/APM-*-win64.zip.sha256
          generate_release_notes: true
